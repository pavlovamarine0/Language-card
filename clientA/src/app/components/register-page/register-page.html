<div class="d-flex align-items-center py-4 bg-body-tertiary">
  <main class="form-signin w-100 m-auto">
    <form>
      <h1 class="h3 mb-3 fw-normal">Please register</h1>
       <div class="form-floating">
        <input
          type="userName"
          class="form-control"
          id="floatingUserName"
          placeholder="Username"
          [(ngModel)]="userRegister.username" name="userName"
        />
        <label for="floatingUserName">Username</label>
      </div>
      <div class="form-floating">
        <input
          type="email"
          class="form-control"
          id="floatingInput"
          placeholder="name@example.com"
          [(ngModel)]="userRegister.email"
          name="email"
        />
        <label for="floatingInput">Email address</label>
      </div>
      <div class="form-floating">
        <input
          type="password"
          class="form-control"
          id="floatingPassword"
          placeholder="Password"
          [(ngModel)]="userRegister.password" name="password"
        />
        <label for="floatingPassword">Password</label>
    </div>
    <!--- @if(userRegister.password){
    <div class="form-floating">
        <input
          type="password"
          class="form-control"
          id="floatingPassword"
          placeholder="Password"
          [(ngModel)]="userRegister.password" name="Checkpassword"
        />
        <label for="floatingPassword">Confirm the password</label>
    </div>  
    }-->
      <div class="form-check text-start my-3">
        <input class="form-check-input" type="checkbox" value="remember-me" id="checkDefault" />
        <label class="form-check-label" for="checkDefault"> Remember me </label>
      </div>
      <button class="btn btn-primary w-100 py-2" type="submit" (click)="register()">Create Account</button>
      <p class="mt-5 mb-3 text-body-secondary">© 2017–2026</p>
    </form>
  </main>
</div>
